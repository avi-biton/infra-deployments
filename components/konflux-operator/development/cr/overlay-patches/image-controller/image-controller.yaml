apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  imageController:
    # patched by hack/preview.sh if IMAGE_CONTROLLER_QUAY_ORG and
    # IMAGE_CONTROLLER_QUAY_TOKEN are set
    enabled: false
    spec:
      # TODO: add logEncoder: console once KonfluxImageControllerSpec
      # gains a logEncoder field (matching KonfluxBuildServiceSpec).
      # The infra-deployments development layer sets --zap-encoder=console
      # via logs-in-console-format-cmd-arg-patch.yaml.
      imageControllerManager:
        replicas: 1
        manager:
          resources:
            requests:
              cpu: 100m
              memory: 20Mi
            limits:
              cpu: 500m
              memory: 2Gi

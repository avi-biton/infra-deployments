apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - path: patches/build/external-secret-path-patch.yaml
    target:
      name: pipelines-as-code-secret
      namespace: build-service
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: patches/integration/external-secret-path-patch.yaml
    target:
      name: pipelines-as-code-secret
      namespace: integration-service
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
